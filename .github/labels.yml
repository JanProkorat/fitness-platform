# Label definitions for JanProkorat/fitness-platform.
# Synced to GitHub by .github/workflows/labels.yml on push to develop.
# The sync deletes any label not listed here.
# Edit this file to add/remove/rename labels — do not edit via the GitHub UI.
#
# Every issue gets one kind label, one priority label, and one package label
# per package whose code it changes (none for a Chore that touches no package).

# --- Kind: exactly one per issue ---
- name: "Epic"
  color: "3e4b9e"
  description: A whole feature, screen or module; split into Tasks.

- name: "Task"
  color: "1d76db"
  description: One implementation step; usually part of an Epic.

- name: "Bug"
  color: "d73a4a"
  description: Something is broken or behaves incorrectly.

- name: "Chore"
  color: "c5def5"
  description: Refactoring, docs, CI, tooling, cleanup.

# --- Package: one per package the issue changes ---
- name: "BE"
  color: "5319e7"
  description: "Backend: /backend (ASP.NET Core API)."

- name: "Web"
  color: "0e8a16"
  description: "Frontend: /web (React portal)."

- name: "Mobile"
  color: "fbca04"
  description: "Frontend: /mobile (Expo app)."

# --- Priority: exactly one per issue ---
- name: "High"
  color: "b60205"
  description: "Priority: high."

- name: "Medium"
  color: "ff9f1c"
  description: "Priority: medium."

- name: "Low"
  color: "c2e0c6"
  description: "Priority: low."
