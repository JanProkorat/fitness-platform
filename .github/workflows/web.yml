name: Web CI

on:
  push:
    branches: [main, develop]
    paths: ['web/**']
  pull_request:
    # See the note in backend.yml — epic branches take their issue's
    # type: prefix, so this must cover more than feature/.
    branches: [main, develop, 'feature/*', 'refactor/*', 'fix/*', 'docs/*', 'chore/*']
    paths: ['web/**']

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
