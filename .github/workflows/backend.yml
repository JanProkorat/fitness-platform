name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.100
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Print .NET SDK info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore FitnessPlatform.Tests/FitnessPlatform.Tests.csproj
        working-directory: backend

      - name: Build
        run: dotnet build FitnessPlatform.Tests/FitnessPlatform.Tests.csproj --no-restore --configuration Release --warnaserror -bl:msbuild.binlog -v:detailed
        working-directory: backend

      - name: Upload MSBuild binary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog
          path: backend/msbuild.binlog
          if-no-files-found: warn

      - name: Test
        run: dotnet test FitnessPlatform.Tests/FitnessPlatform.Tests.csproj --no-build --configuration Release --verbosity normal
        working-directory: backend
        env:
          POSTGRES_PASSWORD: test_password
          MONGO_PASSWORD: test_password
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: test
          JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters-long!!
