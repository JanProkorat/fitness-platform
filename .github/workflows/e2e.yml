name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    # See the note in backend.yml — epic branches take their issue's
    # type: prefix, so this must cover more than feature/.
    branches: [main, develop, 'feature/*', 'refactor/*', 'fix/*', 'docs/*', 'chore/*']
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.test.yml'
      - 'package.json'
      - '.env.test.example'
      - '.github/workflows/e2e.yml'
      - 'scripts/test-env'
      - 'qa-playwright/**'
      - 'docs/wiki/**'
      - 'scripts/wiki-*'
      - 'scripts/fetch-swagger.py'
      - 'scripts/test_wiki_*'
      - 'scripts/test_fetch_swagger.py'
      - 'scripts/notion-upload.py'
      - 'scripts/test_notion_upload.py'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      # Pass the branch name through to scripts/test-env so the per-branch
      # COMPOSE_PROJECT_NAME is stable across this job's steps (each step
      # spawns a fresh shell, so we cannot rely on the CLI's `current_branch`
      # fallback — actions/checkout produces a detached HEAD).
      TEST_ENV_BRANCH: ${{ github.head_ref || github.ref_name }}
      # One image tag for the bake step and `test-env up`, so `up` finds the
      # images bake loaded instead of looking for per-project names.
      E2E_IMAGE_TAG: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Verify required secrets exist
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::error::Missing required secret JWT_SECRET. Configure it at Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.QA_SEED_PASSWORD }}" ]; then
            echo "::error::Missing required secret QA_SEED_PASSWORD. Configure it at Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Write .env.test from secrets
        run: |
          umask 077
          {
            printf 'JWT_SECRET=%s\n' "${JWT_SECRET}"
            printf 'QA_SEED_PASSWORD=%s\n' "${QA_SEED_PASSWORD}"
          } > .env.test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the harness images with layers cached in the GitHub Actions
      # cache, so a run that changes nothing under backend/ or web/ reuses
      # every layer. The cache is keyed by layer inputs, so a changed file
      # rebuilds from the first layer that copies it — never a stale image.
      # seed is not a target: it shares api's image (docker-compose.test.yml).
      - name: Build harness images (cached)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.test.yml
          targets: api,web,playwright
          load: true
          set: |
            api.cache-from=type=gha,scope=e2e-api
            api.cache-to=type=gha,mode=max,scope=e2e-api
            web.cache-from=type=gha,scope=e2e-web
            web.cache-to=type=gha,mode=max,scope=e2e-web
            playwright.cache-from=type=gha,scope=e2e-playwright
            playwright.cache-to=type=gha,mode=max,scope=e2e-playwright

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Install Playwright system deps when cache hits
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web

      - name: Boot compose harness
        # scripts/test-env up waits for the api healthcheck before returning;
        # if it exits 0 the stack is ready. The JSON envelope is captured to
        # the GITHUB_ENV so later steps can read api_url without re-shelling
        # into the CLI. TEST_ENV_NO_BUILD makes `up` use the baked images and
        # fail loudly if one is missing, instead of rebuilding it uncached.
        env:
          TEST_ENV_NO_BUILD: '1'
        run: |
          set -euo pipefail
          envelope=$(./scripts/test-env up "$TEST_ENV_BRANCH")
          echo "$envelope"
          api_url=$(printf '%s' "$envelope" | jq -r '.api_url')
          if [ -z "$api_url" ] || [ "$api_url" = "null" ]; then
            echo "::error::scripts/test-env up returned no api_url"
            exit 1
          fi
          echo "E2E_API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Wiki screen inventory check
        # Validates docs/wiki/screens.json against the harness's live Swagger,
        # so an endpoint rename or a deleted page file fails here, not in Notion.
        run: |
          set -euo pipefail
          python3 scripts/test_wiki_check.py
          python3 scripts/test_wiki_api.py
          python3 scripts/test_fetch_swagger.py
          python3 scripts/test_notion_upload.py
          curl -ksSf "$E2E_API_URL/swagger/v1/swagger.json" -o "$RUNNER_TEMP/swagger.json"
          python3 scripts/wiki-check.py --swagger "$RUNNER_TEMP/swagger.json"

      - name: Run Playwright tests (host suite — regression smoke)
        run: npx playwright test
        working-directory: web
        env:
          E2E_API_URL: ${{ env.E2E_API_URL }}
          CI: 'true'
          # Pass secrets explicitly so auth.setup.ts receives them even before
          # dotenv.config has a chance to read .env.test (which docker-compose
          # already consumed in the previous step). dotenv does not override
          # existing env vars, so these shell-level values always win.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}

      # ── Containerised named-flow runs ────────────────────────────────────
      # DISABLED ON THIS BRANCH ONLY — the web portal is being rebuilt from
      # scratch (epic #1052) and every page these flows drive was deleted by
      # the clean-slate strip. Their specs are quarantined under
      # web/tests/e2e/_legacy/ for the same reason. Leaving the steps active
      # would keep the E2E check red on all nine child PRs for a reason that
      # has nothing to do with the code under review.
      #
      # These are commented out rather than deleted so the diff that restores
      # each one is a comment removal, not a rewrite. Re-enable each with the
      # sub-issue that rebuilds its page:
      #
      #   food-admin-upload    → the Ingredients page sub-issue of #1052
      #   recipe-gallery-upload → the Recipes page sub-issue of #1052
      #
      # Do NOT re-enable these by merging this branch to develop with the
      # comments still in place and the pages rebuilt — check the list above
      # before the epic PR.
      #
      # - name: Run named flow — food-admin-upload
      #   run: ./scripts/test-env run food-admin-upload
      #
      # - name: Run named flow — recipe-gallery-upload
      #   run: ./scripts/test-env run recipe-gallery-upload

      # ── Artifact uploads ──────────────────────────────────────────────────
      # .qa-artifacts/ holds the container playwright's traces + screenshots
      # via the docker-compose bind-mount; upload always (success and failure)
      # so the JSON pass/fail evidence is durable per the AC.
      - name: Upload .qa-artifacts (container playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ github.run_number }}
          path: .qa-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright HTML report on failure (host suite)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results on failure (host suite)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_number }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump harness logs on failure
        if: failure()
        run: ./scripts/test-env logs-tail api "$TEST_ENV_BRANCH" 500

      - name: Tear down compose harness
        if: always()
        run: ./scripts/test-env down "$TEST_ENV_BRANCH" || true

      - name: Remove .env.test
        if: always()
        run: rm -f .env.test
