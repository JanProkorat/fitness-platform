# End-to-end test harness — packaged backend + datastores + deterministic seed.
#
# Boot via `scripts/test-env up [<branch>]` (or `npm run e2e:up`, which now
# wraps the CLI). The CLI derives a per-branch `COMPOSE_PROJECT_NAME` so that
# parallel runs on different branches coexist on ephemeral host ports.
#
# Networking:
#   All services join the project-scoped `qa-net` network. Only `api`
#   publishes to a host port (assigned dynamically by docker). web,
#   mobile-web, and playwright (added in Phase 2) talk to api via internal
#   DNS — they MUST NOT publish host ports of their own, or parallel runs
#   collide on host :5173/:8081.
#
# Container names:
#   No `container_name:` entries — compose names containers as
#   <COMPOSE_PROJECT_NAME>-<service>-1 so two stacks for different branches
#   can sit side by side. Reference containers via `docker compose ... ps`
#   rather than hard-coded names.

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: fitness_admin
      POSTGRES_PASSWORD: fitness_test_password
      POSTGRES_DB: fitness_test
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_admin -d fitness_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo-test:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_test_password
    networks:
      - qa-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-test:
    # Pinned to a specific MinIO release so the harness behaves identically
    # across CI runs + dev workstations. Rolling `latest` exposed us to surprise
    # upstream changes that could flip CI red across all branches at once.
    # When bumping: pick the absolute newest tag from Docker Hub (NOT GitHub —
    # MinIO Inc's CVE-only patches are sometimes tagged on GitHub but never
    # pushed as a Docker image; verify via
    # `curl -s 'https://hub.docker.com/v2/repositories/minio/minio/tags?ordering=last_updated' | jq '.results[].name'`),
    # then rebuild the image (`docker compose -f docker-compose.test.yml
    # build minio-test`) and re-verify the `mc ready local` healthcheck.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_test_password
    command: server /data --console-address :9001
    networks:
      - qa-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: ./backend
    depends_on:
      postgres-test:
        condition: service_healthy
      mongo-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    # JWT_SECRET and QA_SEED_PASSWORD come from .env.test (gitignored).
    # Copy .env.test.example to .env.test and fill it in before `npm run e2e:up`.
    env_file:
      - .env.test
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_PASSWORD: fitness_test_password
      MONGO_PASSWORD: mongo_test_password
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minio_test_password
      ConnectionStrings__PostgreSQl: "Host=postgres-test;Port=5432;Database=fitness_test;Username=fitness_admin"
      ConnectionStrings__MongoDB: "mongodb://admin:{0}@mongo-test:27017/?authSource=admin"
      MongoDB__DatabaseName: fitness_test
      MinIO__Endpoint: "minio-test:9000"
      MinIO__BucketName: "fitness-platform-test"
      # Local MinIO overrides — appsettings.Development.json is configured for
      # Cloudflare R2 (Secure=true, https PublicEndpoint, ManageBucket=false).
      # The harness MinIO serves plain HTTP and needs path-style public URLs +
      # bucket management, so override the R2-specific settings here.
      MinIO__Secure: "false"
      MinIO__PublicEndpoint: "http://minio-test:9000"
      MinIO__ManageBucket: "true"
      MinIO__PublicUrlIncludesBucket: "true"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minio_test_password"
      RateLimiting__Disabled: "true"
    networks:
      - qa-net
    command: ["--qa-seed"]
    restart: "no"

  api:
    build:
      context: ./backend
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      # Ephemeral host port — docker assigns at `up` time, scripts/test-env
      # surfaces the assigned port via `docker compose port api 8080` and
      # writes it to .test-env.<project>.env. The interactive dev API stays
      # on :5001 (separate stack); they cannot collide because we no longer
      # bind to a fixed host port here.
      - "8080"
    # JWT_SECRET comes from .env.test (gitignored).
    env_file:
      - .env.test
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:8080"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "devcert"
      POSTGRES_PASSWORD: fitness_test_password
      MONGO_PASSWORD: mongo_test_password
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minio_test_password
      ConnectionStrings__PostgreSQl: "Host=postgres-test;Port=5432;Database=fitness_test;Username=fitness_admin"
      ConnectionStrings__MongoDB: "mongodb://admin:{0}@mongo-test:27017/?authSource=admin"
      MongoDB__DatabaseName: fitness_test
      MinIO__Endpoint: "minio-test:9000"
      MinIO__BucketName: "fitness-platform-test"
      # Local MinIO overrides — appsettings.Development.json is configured for
      # Cloudflare R2 (Secure=true, https PublicEndpoint, ManageBucket=false).
      # The harness MinIO serves plain HTTP and needs path-style public URLs +
      # bucket management, so override the R2-specific settings here.
      MinIO__Secure: "false"
      MinIO__PublicEndpoint: "http://minio-test:9000"
      MinIO__ManageBucket: "true"
      MinIO__PublicUrlIncludesBucket: "true"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minio_test_password"
      # localhost entries cover host-Playwright + the existing dev workflow.
      # Phase 2 adds CORS entries for the internal `web` and `mobile-web`
      # service DNS names so the containerised Playwright can hit the API.
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:8081"
      Cors__AllowedOrigins__2: "http://web:5173"
      Cors__AllowedOrigins__3: "http://mobile-web:8081"
      RateLimiting__Disabled: "true"
      # Enables POST /test/reset for Playwright global-setup. The endpoint
      # remains double-gated: this flag is one half; the other is that
      # ASPNETCORE_ENVIRONMENT=Development (above). Both must be true for
      # the endpoint to respond — in production the env gate alone keeps it 404.
      Testing__Enabled: "true"
    networks:
      - qa-net
    healthcheck:
      # Self-signed dev cert — `-k` is intentional inside the container.
      test: ["CMD-SHELL", "curl -ksSf https://localhost:8080/swagger/v1/swagger.json | grep -q '/auth/login'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Web SPA (trainer/nutritionist portal) ─────────────────────────────────
  # Internal-only (no host port). Vite e2e dev server with the API proxy
  # pointed at the internal `api` service. Playwright reaches us via
  # http://web:5173 over qa-net.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      E2E_API_URL: "https://api:8080"
    expose:
      - "5173"
    networks:
      - qa-net
    healthcheck:
      # Node's built-in http client — no curl/wget needed in the slim image.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── mobile-web (client app as RN-Web bundle) ──────────────────────────────
  # Internal-only (no host port). Static bundle from `expo export --platform web`
  # served with `serve`. SPA was built with EXPO_PUBLIC_API_BASE_URL=https://api:8080
  # baked in, so XHR is cross-origin to `api` — CORS is allow-listed above.
  mobile-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8081"
    networks:
      - qa-net
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8081/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Playwright runner ─────────────────────────────────────────────────────
  # Idle long-lived container. `scripts/test-env run <flow>` invokes
  # `docker compose exec playwright /work/named-flow-runner.sh <flow>`
  # which runs the corresponding spec. Test artifacts (HTML report, trace,
  # screenshots) land in /work/web/playwright-report + /work/web/test-results,
  # which the bind-mount surfaces at .qa-artifacts/<project>/ on the host.
  playwright:
    build:
      context: .
      dockerfile: qa-playwright/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mobile-web:
        condition: service_healthy
    environment:
      # Mirror the build-time env so npm scripts inside the container can
      # read the same values when invoked via `exec`.
      PLAYWRIGHT_BASE_URL: "http://web:5173"
      MOBILE_WEB_BASE_URL: "http://mobile-web:8081"
      PLAYWRIGHT_IN_CONTAINER: "true"
      E2E_API_URL: "https://api:8080"
      CI: "true"
    env_file:
      - .env.test
    volumes:
      # Surface playwright report + test-results to the host. `:rw` lets the
      # container write screenshots/traces; the host then uploads them as CI
      # artifacts in Phase 5.
      - ./.qa-artifacts:/work/web/playwright-report:rw
      - ./.qa-artifacts/test-results:/work/web/test-results:rw
    networks:
      - qa-net
    healthcheck:
      test: ["CMD", "test", "-f", "/work/named-flow-runner.sh"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  qa-net:
    driver: bridge
