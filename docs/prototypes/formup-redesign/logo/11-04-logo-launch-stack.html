<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo &amp; icon · Combo 4 · stacked cards · dark</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}

.wm{animation:g-wm 3.4s cubic-bezier(.3,0,.2,1) infinite}
@keyframes g-wm{0%,32%{opacity:0;letter-spacing:.42em}55%,88%{opacity:1;letter-spacing:.22em}100%{opacity:0}}

.draw{stroke-dasharray:100;animation:g-draw 3.4s cubic-bezier(.6,0,.2,1) infinite}
.d2{animation-delay:.12s}.d3{animation-delay:.24s}
@keyframes g-draw{0%,30%{stroke-dashoffset:100}50%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.inL{animation:g-inl 3.4s cubic-bezier(.3,1.3,.5,1) infinite}.inR{animation:g-inr 3.4s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes g-inl{0%{transform:translateX(-16px);opacity:0}28%,88%{transform:translateX(0);opacity:1}100%{opacity:0}}
@keyframes g-inr{0%{transform:translateX(16px);opacity:0}28%,88%{transform:translateX(0);opacity:1}100%{opacity:0}}
.fade{animation:g-fade 3.4s ease-out infinite}
@keyframes g-fade{0%,26%{opacity:0}40%,88%{opacity:1}100%{opacity:0}}
.zl,.zr{animation:g-zl 3.4s cubic-bezier(.3,1.3,.5,1) infinite both}.zr{animation-name:g-zr}
@keyframes g-zl{0%{transform:translateX(-30px);opacity:0}30%,88%{transform:translateX(0);opacity:1}100%{opacity:0}}
@keyframes g-zr{0%{transform:translateX(30px);opacity:0}30%,88%{transform:translateX(0);opacity:1}100%{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:g-pop 3.4s cubic-bezier(.3,1.7,.5,1) infinite}
.q1{animation-delay:.1s}.q2{animation-delay:.2s}
@keyframes g-pop{0%{transform:scale(0)}18%,88%{transform:scale(1)}100%{transform:scale(0)}}
.pageL,.pageR{transform-box:view-box;animation:g-page 3.4s cubic-bezier(.3,1.2,.5,1) infinite}
.pageL{transform-origin:50px 50px}.pageR{transform-origin:50px 50px}
@keyframes g-page{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.tick{stroke-dasharray:100;animation:g-tick 3.4s ease-out infinite}
@keyframes g-tick{0%,40%{stroke-dashoffset:100}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.c1,.c2,.c3{animation:g-card 3.4s cubic-bezier(.3,1.3,.5,1) infinite}.c2{animation-delay:.1s}.c3{animation-delay:.2s}
@keyframes g-card{0%{transform:translate(14px,-14px);opacity:0}25%,88%{transform:translate(0,0);opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

</style>
</head>
<body>
<div role="img" aria-label="Form Up" style="position: relative; width: 390px; height: 844px; background: #0B0B0C; overflow: hidden; display: flex; align-items: center; justify-content: center">
<span style="display: inline-block; font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 36px; letter-spacing: 0.22em; line-height: 1; white-space: nowrap; color: #F5F5F7; padding-left: 0.22em"><svg width="23" height="27" viewBox="18 10 68 80" aria-hidden="true" style="display: inline-block; vertical-align: baseline; margin-right: 0.18em; overflow: visible"><rect class="c1" x="32" y="10" width="54" height="62" rx="15" fill="#F4A08A"></rect><rect class="c2" x="25" y="19" width="54" height="62" rx="15" fill="#D2342A"></rect><rect class="c3" x="18" y="28" width="54" height="62" rx="15" fill="#7A1A14"></rect><circle class="pop" cx="31" cy="43" r="4" fill="#FFFFFF"></circle><path class="draw" pathLength="100" d="M39 43 H62" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#FFFFFF" stroke-width="6"></path><circle class="pop q1" cx="31" cy="57" r="4" fill="#FFFFFF"></circle><path class="draw d2" pathLength="100" d="M39 57 H54" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#FFFFFF" stroke-width="6"></path><circle class="pop q2" cx="31" cy="71" r="4" fill="#FFFFFF"></circle></svg><span class="wm" style="display: inline-block">ORM&nbsp;<span style="color: #E5483D">UP</span></span></span>
</div>

</html>
