<html lang="en">
<head>
<meta charset="utf-8">

<style>
body{margin:0}

</style>

<style>
html,body{margin:0}
body{overflow-x:hidden}
.fu-hot{cursor:pointer}
body.fu-show .fu-hot{outline:2px solid rgba(37,99,235,.75);outline-offset:1px}
#fu-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:6px;align-items:center;padding:6px;border-radius:14px;background:rgba(20,20,20,.88);color:#fff;font:600 12px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#fu-bar a,#fu-bar button,#fu-bar select{height:30px;padding:0 10px;border-radius:9px;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;text-decoration:none;display:flex;align-items:center;cursor:pointer}
#fu-bar .on{background:#fff;color:#141414}
</style>
<script>
(function(){
  var FLOW = {"Clients": "PageClients", "Inbox": "PageInbox", "Recipes": "PageRecipes", "Ingredients": "PageIngredients", "Plan templates": "PageTemplates", "Forms": "PageForms", "Log out": "PageHome", "^Set up your profile": "PageClients", "Skip for now and go to the portal": "PageClients"}, PAGE = "PageRegisterVerified", THEME = "dark", PAGES = [["PageHome", "Home · full page"], ["PageHomeSignIn", "Home · Sign in dialog"], ["PageRegister", "Register · 1 Account"], ["PageRegisterCheckEmail", "Register · 2 Check email"], ["PageRegisterVerified", "Register · 3 Email verified"], ["PageClients", "Clients"], ["PageClientDetail", "ClientDetail"], ["PageClientNutrition", "ClientDetail · Nutrition tab"], ["PageClientNutritionEmpty", "ClientDetail · Nutrition, no plan yet"], ["PageClientPlanEditor", "Client plan · Library › Templates"], ["PageClientPlanDay", "Client plan · Day view"], ["PageClientPlanDayAddMeal", "Client plan · Day · Add meal drawer"], ["PageClientPlanStartOver", "Client plan · replace with template?"], ["PageClientPlanInfo", "Client plan · Plan info tab"], ["PageClientPlanBlank", "Client plan · blank"], ["PageClientPlanClosed", "Client plan · panel closed"], ["PageInbox", "Inbox"], ["PageRecipes", "Recipes"], ["PageRecipesTable", "Recipes · table view"], ["PageRecipeDrawer", "Recipe drawer · Details tab"], ["PageRecipeDrawerIngredients", "Recipe drawer · Ingredients tab"], ["PageRecipeDrawerPreparation", "Recipe drawer · Preparation tab"], ["PageRecipeDrawerPictures", "Recipe drawer · Pictures tab"], ["PageIngredients", "Ingredients"], ["PageIngredientDrawer", "IngredientDrawer"], ["PageTemplates", "Templates"], ["PageTemplateNew", "TemplateNew"], ["PageTemplateEditorEmpty", "TemplateEditor · empty (no meals chosen)"], ["PageTemplateEditor", "TemplateEditor"], ["PageTemplateMeal", "TemplateMeal"], ["PageTemplateNutrition", "TemplateNutrition"], ["PageTemplateDay", "TemplateDay"], ["PageTemplateDayAddMeal", "TemplateDay · Add meal drawer"], ["PageForms", "Forms"], ["PageFormOnboarding", "Form editor · Client onboarding"], ["PageFormCheckIn", "Form editor · Weekly check-in"]];
  function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }
  function target(el){
    var k = key(el);
    for (var m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : k === m) return FLOW[m]; }
    return null;
  }
  function go(page, theme){ location.href = page + '-' + (theme || THEME) + '.html'; }
  function fit(){
    // Boards are fixed-size frames; zoom the frame to the window width and paint the page in its colour.
    var board = document.body.firstElementChild;
    if (!board || board.id === 'fu-bar') return;
    if (!board.dataset.w){ board.dataset.w = board.offsetWidth; document.body.style.background = getComputedStyle(board).backgroundColor; }
    board.style.zoom = document.documentElement.clientWidth / board.dataset.w;
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', function(){
    fit();
    document.querySelectorAll('a,button,tr,[role=tab],[role=radio]').forEach(function(el){ if (target(el)) el.classList.add('fu-hot'); });
    var bar = document.createElement('div'); bar.id = 'fu-bar';
    var opts = PAGES.map(function(p){ return '<option value="'+p[0]+'"'+(p[0]===PAGE?' selected':'')+'>'+p[1]+'</option>'; }).join('');
    bar.innerHTML = '<select aria-label="Jump to screen">'+opts+'</select>'
      + '<button data-t="light" class="'+(THEME==='light'?'on':'')+'">Light</button><button data-t="dark" class="'+(THEME==='dark'?'on':'')+'">Dark</button>'
      + '<button data-h="1" title="Show clickable areas (H)">Hotspots</button><a href="../index.html">All screens</a>';
    document.body.appendChild(bar);
    bar.querySelector('select').addEventListener('change', function(e){ go(e.target.value); });
    bar.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click', function(){ go(PAGE, b.getAttribute('data-t')); }); });
    bar.querySelector('[data-h]').addEventListener('click', function(){ document.body.classList.toggle('fu-show'); });
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('fu-show'); });
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#fu-bar')) return;
    var el = e.target.closest ? e.target.closest('a,button,tr,[role=tab],[role=radio]') : null;
    if (!el) return;
    e.preventDefault();
    var t = target(el);
    if (t) go(t); else if (el.tagName !== 'TR' && !document.body.classList.contains('fu-show')) { document.body.classList.add('fu-show'); setTimeout(function(){ document.body.classList.remove('fu-show'); }, 600); }
  }, true);
})();
</script>

svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Verify email</span><span style="flex-grow: 1; height: 2px; border-radius: 1px; background: #F4F2EE"></span><span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #F4F2EE"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; background: #E5483D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">3</span>Your profile</span></div></div><span style="width: 84px; height: 84px; border-radius: 42px; background: #243319; color: #8CC152; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.01em">Email verified</h1><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #CFCAC2">Welcome to Form Up, Jan. Your account is ready.</p><a href="#" style="align-self: stretch; height: 48px; border-radius: 12px; background: #F4F2EE; color: #141414; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">Set up your profile<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a><a href="#" style="font-size: 13px; font-weight: 600; color: #958F87">Skip for now and go to the portal</a><div style="align-self: stretch; display: flex; flex-direction: column; padding-top: 6px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #958F87; text-align: left; padding-bottom: 4px">WHAT’S NEXT</span><div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #2A292C; text-align: left"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #0E0E0F; border: 1px solid #2A292C; color: #CFCAC2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Invite your first client</span><span style="font-size: 12px; color: #958F87">They join with the Form Up app</span></span></div><div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #2A292C; text-align: left"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #0E0E0F; border: 1px solid #2A292C; color: #CFCAC2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Build their first week</span><span style="font-size: 12px; color: #958F87">From a template or from scratch</span></span></div></div></div></main></div>
