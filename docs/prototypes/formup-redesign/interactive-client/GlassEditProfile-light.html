<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditProfile · light · Form Up prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#3A3835}
input::placeholder{color:#8A8782}
</style>

<style>
html,body{margin:0}
body{overflow-x:hidden}
body.fu-device{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E4E1DC}
body.fu-device.fu-dark{background:#1C1C1F}
.fu-hot{cursor:pointer}
body.fu-show .fu-hot{outline:2px solid rgba(37,99,235,.75);outline-offset:1px}
#fu-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:6px;align-items:center;padding:6px;border-radius:14px;background:rgba(20,20,20,.88);color:#fff;font:600 12px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#fu-bar a,#fu-bar button,#fu-bar select{height:30px;padding:0 10px;border-radius:9px;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;text-decoration:none;display:flex;align-items:center;cursor:pointer}
#fu-bar .on{background:#fff;color:#141414}
</style>
<script>
(function(){
  var FLOW = {"Today": "GlassToday", "Training": "GlassTrainingWeek", "Nutrition": "GlassNutrition", "*Messages": "GlassMessagesList"}, PAGE = "GlassEditProfile", THEME = "light", PAGES = [["GlassLaunchQuiet", "Launch · light"], ["GlassLogin", "Login · light"], ["GlassRegister", "Register · light"], ["GlassRegisterCheckEmail", "RegisterCheckEmail · light"], ["GlassRegisterChangeEmail", "RegisterChangeEmail · light"], ["GlassRegisterVerified", "RegisterVerified · light"], ["GlassOnboardingGoal", "OnboardingGoal · light"], ["GlassOnboardingBasics", "OnboardingBasics · light"], ["GlassOnboardingLifestyle", "OnboardingLifestyle · light"], ["GlassOnboardingTraining", "OnboardingTraining · light"], ["GlassOnboardingEating", "OnboardingEating · light"], ["GlassOnboardingEatingSheet", "OnboardingEating · add sheet · light"], ["GlassOnboardingMotivation", "OnboardingMotivation · light"], ["GlassTodayNoCoach", "TodayNoCoach · light"], ["GlassCoachSearch", "CoachSearch · light"], ["GlassCoachProfile", "CoachProfile · light"], ["GlassRequestSheet", "RequestSheet · light"], ["GlassNotificationsInvite", "NotificationsInvite · light"], ["GlassInviteDetail", "InviteDetail · light"], ["GlassCoachProfileMore", "CoachProfile scrolled · light"], ["GlassToday", "Today · light"], ["GlassTodayV1", "Today · v1 (check-in only) · light"], ["GlassNotifications", "Notifications · light"], ["GlassTrainingWeek", "TrainingWeek · light"], ["GlassTrainingEmpty", "TrainingEmpty · light"], ["GlassSessionDetail", "SessionDetail · light"], ["GlassWorkout", "Workout · light"], ["GlassSessionMixed", "SessionMixed · light"], ["GlassAmrap", "Amrap · light"], ["GlassEmom", "Emom · light"], ["GlassTabata", "Tabata · light"], ["GlassForTime", "ForTime · light"], ["GlassDoneStrength", "DoneStrength · light"], ["GlassDoneAmrap", "DoneAmrap · light"], ["GlassDoneTabata", "DoneTabata · light"], ["GlassSessionSummary", "SessionSummary · light"], ["GlassNutrition", "Nutrition · light"], ["GlassNutritionEmpty", "NutritionEmpty · light"], ["GlassMealDetail", "MealDetail · light"], ["GlassShoppingList", "ShoppingList · light"], ["GlassNutritionWaiting", "NutritionWaiting · nutritionist linked, no plan yet · light"], ["GlassNutritionOffPlan", "NutritionOffPlan · food eaten outside the plan · light"], ["GlassNutritionOffPlanSearch", "NutritionOffPlanSearch · add food, search step · light"], ["GlassNutritionOffPlanAmount", "NutritionOffPlanAmount · add food, amount step · light"], ["GlassNutritionUpcoming", "NutritionUpcoming · plan published, starts later · light"], ["GlassTrainingUpcoming", "TrainingUpcoming · plan published, starts later · light"], ["GlassMessagesList", "MessagesList · light"], ["GlassChat", "Chat · light"], ["GlassMessagesListInvite", "MessagesList · new invite · light"], ["GlassChatInvite", "ChatInvite · light"], ["GlassChatInviteStates", "ChatInvite states · light"], ["GlassProfile", "Profile · light"], ["GlassMyJourney", "MyJourney · light"], ["GlassPlanSummary", "PlanSummary · light"], ["GlassMeasurements", "Measurements · light"], ["GlassPhotos", "Photos · light"], ["GlassCheckIn", "CheckIn · light"], ["GlassSettings", "Settings · light"], ["GlassMeasurementsAddSheet", "Measurements · add sheet · light"], ["GlassCheckInHistory", "CheckInHistory · light"], ["GlassEditProfile", "EditProfile · light"], ["GlassEditProfileInfo", "EditProfile · my info · light"], ["GlassEditProfileInfo2", "EditProfile · my info 2 · light"], ["GlassTrainingPlan", "TrainingPlan · light"], ["GlassTrainingWeekDetail", "TrainingWeekDetail · light"], ["GlassNutritionPlan", "NutritionPlan · light"], ["GlassNutritionPlanWeek", "NutritionPlanWeek · one week of the plan, by day · light"], ["GlassMealPhotoViewer", "MealPhotoViewer · meal photo full screen · light"], ["GlassNutritionPlans", "NutritionPlans · all plans, opened from the calendar icon · light"], ["GlassNutritionPlanNotStarted", "NutritionPlan · a plan that has not started yet · light"], ["GlassRecipesPlan", "RecipesPlan · light"], ["GlassRecipesAll", "RecipesAll · light"], ["GlassRecipeDetail", "RecipeDetail · light"], ["GlassCookingSteps", "CookingSteps · light"], ["GlassIngredientDetail", "IngredientDetail · light"], ["GlassWorkoutsPlan", "WorkoutsPlan · light"], ["GlassWorkoutsAll", "WorkoutsAll · light"], ["GlassWorkoutDetail", "WorkoutDetail · light"], ["GlassExerciseDetail", "ExerciseDetail · light"], ["GlassPayment", "Payments · light"], ["GlassCoachPlanEnded", "CoachPlanEnded · light"], ["GlassTodayNoCoachInvite", "TodayNoCoach · invite in its slot · light (full scroll)"], ["GlassTodayNoPlan", "TodayNoPlan · nothing optional set up · light"], ["GlassTodayNoPlanFull", "TodayNoPlan · everything set up · light (full scroll)"], ["GlassTodayNoCoachInviteBoth", "TodayNoCoach · one coach invites for training + nutrition · light (full scroll)"], ["GlassTodayNoPlanBoth", "TodayNoPlan · one coach building both plans · light"], ["GlassTodayPlanUpcoming", "TodayPlanUpcoming · 1a · nutrition starts Monday, no trainer · light"], ["GlassTodayUpcomingTrainerBuilding", "TodayUpcomingTrainerBuilding · 1b · nutrition starts Monday, trainer still building · light"], ["GlassTodayUpcomingBoth", "TodayUpcomingBoth · 2 · nutrition starts Monday, training starts Wednesday · light"], ["GlassTodayNutritionUpcomingTrainingActive", "TodayNutritionUpcomingTrainingActive · 3 · training running, nutrition starts Monday · light"], ["GlassTodayTrainingUpcomingNutritionActive", "TodayTrainingUpcomingNutritionActive · 4 · nutrition running, training starts Monday · light"], ["GlassTodayTrainingUpcoming", "TodayTrainingUpcoming · 5 · training starts Monday, no nutritionist · light"], ["GlassTodayBlocks", "Today blocks · one block per plan state, composed into Today · light"], ["GlassNutritionPlanWeekMore", "NutritionPlanWeek · week at a glance + recipes today, full scroll · light"], ["GlassOfflineNutrition", "OfflineNutrition · offline, entries not synced yet · light"], ["GlassOfflineSynced", "OfflineSynced · back online, compact sync card · light"], ["GlassOfflineShopping", "OfflineShopping · item ticked offline · light"], ["GlassOfflineMeasurements", "OfflineMeasurements · measurement added offline · light"], ["GlassOfflineSyncedSheet", "OfflineSyncedSheet · sync details sheet · light"]], DEVICE = true;
  function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }
  function target(el){
    // Exact keys win over ^prefix and *contains keys; a null target marks a label as not clickable.
    var k = key(el), m;
    if (Object.prototype.hasOwnProperty.call(FLOW, k)) return FLOW[k];
    for (m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : false) return FLOW[m]; }
    return null;
  }
  function go(page, theme){ location.href = page + '-' + (theme || THEME) + '.html'; }
  function fit(){
    // Boards are fixed-size frames. Web: zoom to the window width, page in the board's colour.
    // Phone: centre the frame, zoomed to fit the window, on a neutral backdrop.
    var board = document.body.firstElementChild;
    if (!board || board.id === 'fu-bar') return;
    if (!board.dataset.w){
      board.dataset.w = board.offsetWidth; board.dataset.h = board.offsetHeight;
      if (DEVICE){
        document.body.classList.add('fu-device'); if (THEME === 'dark') document.body.classList.add('fu-dark');
        board.style.borderRadius = '48px'; board.style.boxShadow = '0 30px 80px rgba(0,0,0,.28), 0 0 0 10px #0B0B0C';
      } else {
        document.body.style.background = getComputedStyle(board).backgroundColor;
      }
    }
    var root = document.documentElement;
    board.style.zoom = DEVICE ? Math.min((root.clientHeight - 64) / board.dataset.h, (root.clientWidth - 64) / board.dataset.w)
                              : root.clientWidth / board.dataset.w;
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', function(){
    fit();
    document.querySelectorAll('a,button,tr,[role=tab],[role=radio]').forEach(function(el){ if (target(el)) el.classList.add('fu-hot'); });
    var bar = document.createElement('div'); bar.id = 'fu-bar';
    var opts = PAGES.map(function(p){ return '<option value="'+p[0]+'"'+(p[0]===PAGE?' selected':'')+'>'+p[1]+'</option>'; }).join('');
    bar.innerHTML = '<select aria-label="Jump to screen">'+opts+'</select>'
      + '<button data-t="light" class="'+(THEME==='light'?'on':'')+'">Light</button><button data-t="dark" class="'+(THEME==='dark'?'on':'')+'">Dark</button>'
      + '<button data-h="1" title="Show clickable areas (H)">Hotspots</button><a href="../index.html">All screens</a>';
    document.body.appendChild(bar);
    bar.querySelector('select').addEventListener('change', function(e){ go(e.target.value); });
    bar.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click', function(){ go(PAGE, b.getAttribute('data-t')); }); });
    bar.querySelector('[data-h]').addEventListener('click', function(){ document.body.classList.toggle('fu-show'); });
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('fu-show'); });
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#fu-bar')) return;
    var el = e.target.closest ? e.target.closest('a,button,tr,[role=tab],[role=radio]') : null;
    if (!el) return;
    e.preventDefault();
    var t = target(el);
    if (t) go(t); else if (el.tagName !== 'TR' && !document.body.classList.contains('fu-show')) { document.body.classList.add('fu-show'); setTimeout(function(){ document.body.classList.remove('fu-show'); }, 600); }
  }, true);
})();
</script>

</head>

x; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid transparent; background: #F6F5F2; color: #141414; font: 500 16px 'DM Sans', sans-serif; outline: none"></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid rgba(20,20,20,0.08)"><div style="display: flex; align-items: center"><label for="ep-last" style="font-size: 13px; color: #6B6863">Last name</label></div><input id="ep-last" type="text" inputmode="text" value="Svobodová" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid transparent; background: #F6F5F2; color: #141414; font: 500 16px 'DM Sans', sans-serif; outline: none"></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid rgba(20,20,20,0.08)"><div style="display: flex; align-items: center"><label for="ep-phone" style="font-size: 13px; color: #6B6863">Phone</label><span style="margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(20,20,20,0.08); font-size: 11px; font-weight: 500; color: #6B6863">Optional</span></div><input id="ep-phone" type="text" inputmode="tel" placeholder="+420 …" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid transparent; background: #F6F5F2; color: #141414; font: 500 16px 'DM Sans', sans-serif; outline: none"></div></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B6863">SIGN-IN</span><div style="border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(20,20,20,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.04); padding: 2px 16px"><div style="display: flex; align-items: center; gap: 12px; padding: 12px 0"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #6B6863">Email</span><span style="font-size: 15px">eva
