<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadcast · Form Up prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#D1D1D6}
</style>

<style>
html,body{margin:0}
body{overflow-x:hidden}
body.fu-device{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E4E1DC}
body.fu-device.fu-dark{background:#1C1C1F}
.fu-hot{cursor:pointer}
body.fu-show .fu-hot{outline:2px solid rgba(37,99,235,.75);outline-offset:1px}
#fu-bar{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;gap:6px;align-items:center;padding:6px;border-radius:14px;background:rgba(20,20,20,.88);color:#fff;font:600 12px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#fu-bar a,#fu-bar button,#fu-bar select{height:30px;padding:0 10px;border-radius:9px;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;text-decoration:none;display:flex;align-items:center;cursor:pointer}
#fu-bar .on{background:#fff;color:#141414}
</style>
<script>
(function(){
  var FLOW = {"Today": "CoachToday", "Clients": "CoachClients", "*Messages": "CoachMessages", "Close": "CoachMessages", "Send to 5 clients": "CoachMessages"}, PAGE = "CoachBroadcast", THEME = "dark", PAGES = [["CoachAccountType", "AccountType"], ["CoachRegister", "Register"], ["CoachSetup", "Setup"], ["CoachToday", "Today"], ["CoachNotifications", "Notifications"], ["CoachClients", "Clients"], ["CoachClientsSearch", "ClientsSearch"], ["CoachClientDetail", "ClientDetail"], ["CoachClientPlans", "ClientPlans"], ["CoachCheckInReview", "CheckInReview"], ["CoachFindClients", "FindClients"], ["CoachProspect", "Prospect"], ["CoachJoinRequest", "JoinRequest"], ["CoachInvite", "Invite"], ["CoachMessages", "Messages"], ["CoachBroadcast", "Broadcast"], ["CoachProfile", "Profile"]], DEVICE = true;
  function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }
  function target(el){
    // Exact keys win over ^prefix and *contains keys; a null target marks a label as not clickable.
    var k = key(el), m;
    if (Object.prototype.hasOwnProperty.call(FLOW, k)) return FLOW[k];
    for (m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : false) return FLOW[m]; }
    return null;
  }
  function go(page, theme){ location.href = page + '-' + (theme || THEME) + '.html'; }
  function fit(){
    // Boards are fixed-size frames. Web: zoom to the window width, page in the board's colour.
    // Phone: centre the frame, zoomed to fit the window, on a neutral backdrop.
    var board = document.body.firstElementChild;
    if (!board || board.id === 'fu-bar') return;
    if (!board.dataset.w){
      board.dataset.w = board.offsetWidth; board.dataset.h = board.offsetHeight;
      if (DEVICE){
        document.body.classList.add('fu-device'); if (THEME === 'dark') document.body.classList.add('fu-dark');
        board.style.borderRadius = '48px'; board.style.boxShadow = '0 30px 80px rgba(0,0,0,.28), 0 0 0 10px #0B0B0C';
      } else {
        document.body.style.background = getComputedStyle(board).backgroundColor;
      }
    }
    var root = document.documentElement;
    board.style.zoom = DEVICE ? Math.min((root.clientHeight - 64) / board.dataset.h, (root.clientWidth - 64) / board.dataset.w)
                              : root.clientWidth / board.dataset.w;
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', function(){
    fit();
    document.querySelectorAll('a,button,tr,[role=tab],[role=radio]').forEach(function(el){ if (target(el)) el.classList.add('fu-hot'); });
    var bar = document.createElement('div'); bar.id = 'fu-bar';
    var opts = PAGES.map(function(p){ return '<option value="'+p[0]+'"'+(p[0]===PAGE?' selected':'')+'>'+p[1]+'</option>'; }).join('');
    bar.innerHTML = '<select aria-label="Jump to screen">'+opts+'</select>'
      + '<button data-t="light" class="'+(THEME==='light'?'on':'')+'">Light</button><button data-t="dark" class="'+(THEME==='dark'?'on':'')+'">Dark</button>'
      + '<button data-h="1" title="Show clickable areas (H)">Hotspots</button><a href="../index.html">All screens</a>';
    document.body.appendChild(bar);
    bar.querySelector('select').addEventListener('change', function(e){ go(e.target.value); });
    bar.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click', function(){ go(PAGE, b.getAttribute('data-t')); }); });
    bar.querySelector('[data-h]').addEventListener('click', function(){ document.body.classList.toggle('fu-show'); });
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('fu-show'); });
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#fu-bar')) return;
    var el = e.target.closest ? e.target.closest('a,button,tr,[role=tab],[role=radio]') : null;
    if (!el) return;
    e.preventDefault();
    var t = target(el);
    if (t) go(t); else if (el.tagName !== 'TR' && !document.body.classList.contains('fu-show')) { document.body.classList.add('fu-show'); setTimeout(function(){ document.body.classList.remove('fu-show'); }, 600); }
  }, true);
})();
</script>

</head>
<body>
<div style="position: relative; width: 390px; height: 844px; background: #0B0B0C; font-family: 'DM Sans', sans-serif; color: #F5F5F7; overflow: hidden">
<div style="position: absolute; top: 0; left: 0; right: 0; padding-top: 84px; display: flex; flex-direction: column; gap: 12px"><div style="padding: 0 20px"><h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; line-height: 1.12; font-weight: 600; letter-spacing: -0.015em">Broadcast</h1></div>
<div style="margin: 0 16px; border-radius: 20px; background: #1C1C1E; border: 1px solid rgba(255,255,255,0.05); box-shadow: none; padding: 12px 16px; display: flex; align-items: center; gap: 12px"><span style="display: flex"><span style="margin-left: 0px; border: 2px solid #1C1C1E; border-radius: 18px; display: flex"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #141414; color: #F6F4F0; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">ES</span></span><span style="margin-left: -10px; border: 2px solid #1C1C1E; border-radius: 18px; display: flex"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #141414; color: #F6F4F0; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">TD</span></span><span style="margin-left: -10px; border: 2px solid #1C1C1E; border-radius: 18px; display: flex"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #141414; color: #F6F4F0; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">KV</span></span><span style="margin-left: -10px; border: 2px solid #1C1C1E; border-radius: 18px; display: flex"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #141414; color: #F6F4F0; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">JK</span></span><span style="margin-left: -10px; border: 2px solid #1C1C1E; border-radius: 18px; display: flex"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: #141414; color: #F6F4F0; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">OM</span></span></span><span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">5 clients</span><span style="font-size: 12px; color: #98989F">Each gets it in their own chat</span></span><span style="margin-left: auto"><button style="height: 30px; padding: 0 12px; border-radius: 15px; background: transparent; color: #F5F5F7; border: 1px solid rgba(255,255,255,0.08); font: 600 12px 'DM Sans', sans-serif; white-space: nowrap">Edit</button></span></div>
<label style="margin: 0 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #98989F">Message<span style="min-height: 150px; padding: 12px 14px; box-sizing: border-box; border-radius: 16px; background: #1C1C1E; border: 1px solid rgba(255,255,255,0.08); font-size: 15px; line-height: 1.5; color: #F5F5F7">Hi <span style="padding: 1px 6px; border-radius: 6px; background: #3A1A17; color: #D2342A; font-weight: 600">first name</span>, next week is a deload — keep the weights at 80 % and focus on sleep.</span></label>
<div style="padding: 0 16px; display: flex; gap: 8px"><button style="height: 32px; padding: 0 12px; border-radius: 16px; background: transparent; color: #D1D1D6; border: 1px solid rgba(255,255,255,0.08); font: 500 13px 'DM Sans', sans-serif; white-space: nowrap">+ First name</button><button style="height: 32px; padding: 0 12px; border-radius: 16px; background: transparent; color: #D1D1D6; border: 1px solid rgba(255,255,255,0.08); font: 500 13px 'DM Sans', sans-serif; white-space: nowrap">+ Full name</button></div></div><div style="position: absolute; top: 30px; left: 16px; right: 16px; height: 40px; display: flex; align-items: center; gap: 10px"><div style="width: 64px; display: flex"><button aria-label="Close" style="position: relative; width: 40px; height: 40px; border-radius: 20px; background: rgba(44,44,48,0.52); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.14); color: #F5F5F7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div><div style="flex-grow: 1; display: flex; justify-content: center"></div><div style="width: 64px; display: flex; justify-content: flex-end"></div></div><button style="position: absolute; left: 20px; right: 20px; bottom: 34px; height: 52px; border-radius: 26px; border: none; font: 600 16px 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F5F5F7; color: #0B0B0C; box-shadow: 0 8px 24px rgba(0,0,0,0.18)">Send to 5 clients<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></button>
</div>
</body>
